{% load static %}<!doctype html>
<html>
<body style="margin:0; padding:0; background:#f4f5f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7; padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
            style="background:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e5e7eb;">
        <tr><td style="background:#0f1533; padding:20px 28px;">
          <img src="{{ site_url }}{% static 'images/logo.png' %}" alt="TournamentSC" height="28" style="display:block;">
        </td></tr>
        <tr><td style="padding:28px;">
          <h2 style="margin:0 0 12px; color:#0f1533;">Your tournament is live</h2>
          <p style="color:#444; line-height:1.5;">Hi {{ t.organizer.user.display_name }},</p>
          <p style="color:#444; line-height:1.5;">
            Great news — <strong>{{ t.name }}</strong> is now live and open to the public.
          </p>
          <table role="presentation" width="100%" cellpadding="6" cellspacing="0"
                style="background:#f8f9fb; border-radius:8px; margin:16px 0; font-size:14px; color:#333;">
            <tr><td><strong>Sport</strong></td><td>{{ t.sport.name }}</td></tr>
            <tr><td><strong>Starts</strong></td><td>{{ t.start_date|date:"d M Y" }}</td></tr>
          </table>
          <p style="margin-top:20px;">
            <a href="{{ site_url }}{{ t.get_absolute_url }}"
              style="background:#FF6B35; color:#fff; padding:10px 18px; border-radius:6px; text-decoration:none; font-weight:bold;">
              View tournament
            </a>
          </p>
        </td></tr>
        <tr><td style="padding:16px 28px; background:#f8f9fb; color:#888; font-size:12px;">
          Team TournamentSC · <a href="{{ site_url }}" style="color:#888;">{{ site_url }}</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
