{% extends 'base_public.html' %}
{% load static %}
{% block title %}Verify Email - TournamentSC{% endblock %}

{% block content %}
<main class="page-min-center">
  <div class="panel" style="max-width: 400px; width:100%; margin:40px auto; padding:32px;">
    <h1 style="text-align:center; margin-bottom: 8px;">Verify Your Email</h1>
    <p class="muted" style="text-align:center; margin-bottom: 24px;">
      We've sent a 6-digit code to <strong>{{ email }}</strong>.
    </p>

    <form method="post" action="{% url 'verify_otp' %}">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <label class="lbl" for="otp">One-Time Password (OTP)</label>
        <input type="text" class="input" name="otp" id="otp" placeholder="123456" maxlength="6" pattern="\d{6}" required autofocus style="text-align:center; font-size:24px; letter-spacing:8px;">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Verify & Continue</button>
    </form>
    
    <div style="margin-top: 24px; text-align:center;">
      <a href="{% url 'login' %}" class="btn-link dim">Back to Login</a>
    </div>
  </div>
</main>
{% endblock %}
