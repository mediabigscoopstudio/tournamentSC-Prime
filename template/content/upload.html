{% extends 'base.html' %}
{% block title %}Create Content — {{ site_conf.site_name }}{% endblock %}
{% block content %}
<section class="section wrap" style="max-width:960px; min-height:75vh; padding: 24px 16px;">
  <div style="margin-bottom:16px;">
    <a class="dim" href="{% url 'content_feed' %}" style="display:inline-flex; align-items:center; gap:6px; font-weight:600; text-decoration:none; color:#5d6789;">
      ← Back to Feed
    </a>
  </div>

  <div id="upload-dialog-container">
    {% include 'partials/create_post_modal.html' with tournaments=tournaments %}
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('create-post-modal');
  if (modal) {
    if (typeof modal.showModal === 'function') {
      modal.showModal();
    } else {
      modal.setAttribute('open', '');
    }
    // If closed or canceled, return to feed
    modal.addEventListener('close', function() {
      window.location.href = "{% url 'content_feed' %}";
    });
    const closeBtn = modal.querySelector('.tsc-modal-close');
    if (closeBtn) {
      closeBtn.onclick = function() {
        window.location.href = "{% url 'content_feed' %}";
      };
    }
    const backBtn = document.getElementById('tsc-back-btn');
    if (backBtn) {
      const origBack = window.tscGoBack;
      window.tscGoBack = function() {
        if (window.tscCurrentStep > 1) {
          window.tscGoToStep(window.tscCurrentStep - 1);
        } else {
          window.location.href = "{% url 'content_feed' %}";
        }
      };
    }
  }
});
</script>
{% endblock %}
